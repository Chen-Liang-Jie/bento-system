# 防止免費版 Supabase 因 7 天沒有活動而自動暫停專案
# 需先在 GitHub 儲存庫 Settings → Secrets and variables → Actions 新增：
#   SUPABASE_URL       例：https://xxxxxxxx.supabase.co
#   SUPABASE_ANON_KEY  Supabase Dashboard → Project Settings → API 的 anon / publishable key
name: Supabase Keep Alive

on:
  schedule:
    # 每月 1、4、7…28、31 日 UTC 03:17（台灣時間 11:17）執行，間隔最長 3 天
    - cron: '17 3 */3 * *'
  workflow_dispatch: # 允許在 Actions 頁面手動執行測試

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::warning::尚未設定 SUPABASE_URL 或 SUPABASE_ANON_KEY，略過本次保活請求。"
            exit 0
          fi

          curl --fail --silent --show-error \
            --retry 3 --retry-delay 10 --max-time 30 \
            -H "apikey: $SUPABASE_ANON_KEY" \
            "${SUPABASE_URL%/}/rest/v1/products?select=id&limit=1"

          echo ""
          echo "Supabase 保活請求成功"
